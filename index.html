<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09050c" />
    <meta
      name="description"
      content="A tiny maze about finding my way back to you."
    />
    <title>Find The Promise Ring</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="maze" aria-label="A three-dimensional heart maze"></canvas>

      <header class="game-header" aria-live="polite">
        <div>
          <p class="eyebrow">Find the promise ring</p>
          <h1>Because it didn't come in time (im sorry lol)</h1>
        </div>
        <button id="hint" class="hint-button" type="button">Hint</button>
      </header>

      <section class="controls" aria-label="Maze controls">
        <p>Swipe anywhere or use the arrows</p>
        <div class="d-pad">
          <button class="direction up" type="button" data-direction="up" aria-label="Move up">↑</button>
          <button class="direction left" type="button" data-direction="left" aria-label="Move left">←</button>
          <span class="d-pad-heart" aria-hidden="true">♡</span>
          <button class="direction right" type="button" data-direction="right" aria-label="Move right">→</button>
          <button class="direction down" type="button" data-direction="down" aria-label="Move down">↓</button>
        </div>
      </section>

      <section id="intro" class="overlay visible" aria-labelledby="intro-title">
        <div class="card">
          <p class="eyebrow">For my Sweet, Sweet Cait</p>
          <h2 id="intro-title">Find The Promise Ring</h2>
          <p>Complete the maze!</p>
          <button id="begin" class="primary-button" type="button">Begin the journey</button>
        </div>
      </section>

      <section id="ending" class="overlay" aria-labelledby="ending-title" aria-hidden="true">
        <div class="card ending-card">
          <p class="eyebrow">I love u</p>
          <div class="big-heart" aria-hidden="true">♥</div>
          <h2 id="ending-title">I still miss u</h2>
          <button id="again" class="secondary-button" type="button">Play again</button>
        </div>
      </section>

      <p id="fallback" class="fallback" hidden>
        This little maze needs WebGL. Please open it in Safari and refresh the page.
      </p>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
